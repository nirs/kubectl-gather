---
version: "2"
linters:
  enable:
    - errcheck
    - nolintlint
    - forbidigo
    # TODO: enable after fixing issues
    #- gocritic
    #- gosec
    #- misspell
    #- stylecheck
    #- unconvert
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.Exit$'
          msg: "os.Exit() is forbidden in library code; return an error instead"
        - pattern: '^log\.(Logger\.)?(Fatal|Fatalf|Fatalln)$'
          msg: "log.Fatal() is forbidden in library code; return an error instead"
        - pattern: '^zap\.(Logger|SugaredLogger)\.(Fatal|Fatalf|Fatalln|Fatalw)$'
          msg: "zap Fatal() calls os.Exit; return an error instead"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path-except: '^pkg/'
        linters:
          - forbidigo
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    golines:
      shorten-comments: true
