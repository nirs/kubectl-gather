---
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  spell:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          skip: go.sum

  tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check go modules are tidy
        run: |
          go mod tidy
          git --no-pager diff --exit-code

  lint:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          install-only: true
      - name: Run lint
        run: make lint

  # Ensure that the code is compatible with the go version from go.mod. Go
  # enforces syntax but does not prevent calling functions from the standard
  # library that are not available in the minimum go version. This job
  # ensures the code is really compatible with the specified go version.
  go-compatibility:
    name: Go compatibility
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract go version
        id: go-version
        run: |
          version=$(awk '/^go [0-9]/ {print $2}' go.mod)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Build kubectl-gather
        run: make

  build-matrix:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goarch: arm64
            goos: windows
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create build tag
        run: git tag latest
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build binary
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make

  e2e-matrix:
    name: E2E (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-26.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create build tag
        run: git tag latest
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install minikube
        run: |
          curl --fail --silent --show-error --location --output minikube \
              https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-${{ matrix.goarch }}
          sudo install minikube /usr/local/bin/
          minikube version
      - name: Install oc
        run: |
          url="https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux"
          if [ "${{ matrix.goarch }}" != "amd64" ]; then
              url="${url}-${{ matrix.goarch }}"
          fi
          curl --fail --silent --show-error --location --output oc.tar.gz "${url}.tar.gz"
          tar xzf oc.tar.gz oc
          sudo install oc /usr/local/bin/
          oc version --client
      - name: Run e2e tests
        run: make e2e-tests
      - name: Delete clusters
        if: always()
        run: make clean
      # Tar manually to work around github limitations with special characters
      # (:) in file names, and getting much smaller archives compared with zip.
      # https://github.com/actions/upload-artifact/issues/546
      - name: Archive test artifacts
        if: always()
        run: |
          find e2e/out -maxdepth 1 \
              -name 'test-*' -print -o \
              -name '*.log' -print \
              > artifacts.txt
          tar --create \
              --gzip \
              --file kubectl-gather-e2e-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
              --transform "s|e2e/out/|kubectl-gather-e2e-${{ matrix.goos }}-${{ matrix.goarch }}/|" \
              --files-from artifacts.txt
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-gather-e2e-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kubectl-gather-e2e-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          compression-level: 0
          retention-days: 15

  unit-test-matrix:
    name: Unit test (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-26.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-26.04-arm
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: darwin
            goarch: amd64
            runner: macos-26-intel
          - goos: darwin
            goarch: arm64
            runner: xcode-27
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create build tag
        run: git tag latest
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download modules
        run: go mod download
      - name: Run unit tests
        run: make unit-tests
