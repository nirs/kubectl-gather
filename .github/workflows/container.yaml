---
name: Container

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:

  container-native:
    name: Build ${{ matrix.goarch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-26.04
          - goarch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create build tag
        run: git describe --tags 2>/dev/null || git tag latest
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and save image
        run: make gather-${{ matrix.goarch }}.tar
      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gather-${{ matrix.goarch }}
          path: gather-${{ matrix.goarch }}.tar
          compression-level: 0
          retention-days: 1

  container-multiarch:
    name: Build multiarch image
    runs-on: ubuntu-latest
    needs: container-native
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create build tag
        run: git describe --tags 2>/dev/null || git tag latest
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: gather-*
          merge-multiple: true
      - name: Create multiarch image
        run: |
          podman load -i gather-amd64.tar
          podman load -i gather-arm64.tar
          make container-multiarch
      - name: Save multiarch image
        run: make gather.tar
      - name: Upload multiarch image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gather
          path: gather.tar
          compression-level: 0
